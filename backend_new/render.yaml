services:
  - type: web
    name: kcca-parkwatch-api
    runtime: python
    plan: free
    rootDir: backend_new
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: kcca-parkwatch-db
          property: connectionString

databases:
  - name: kcca-parkwatch-db
    plan: free
    databaseName: kcca_parkwatch
    user: parkwatch_admin
