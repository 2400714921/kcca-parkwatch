services:
  - type: web
    name: kcca-parkwatch-api
    runtime: python
    plan: free
    rootDir: backend_new
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "*"
